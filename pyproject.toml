[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-paper-lab"
version = "0.1.0"
description = "Paper-only fly-connectome and compact PPO trading experiments"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.2,<3", "torch>=2.6,<3", "requests>=2.32,<3", "feedparser>=6,<7", "defusedxml>=0.7,<1", "pillow>=11,<13", "pandas>=2.2,<4", "pyarrow>=19,<26"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
cloud = ["modal>=1.5,<2", "websockets==16.0"]
news = ["transformers>=4.50,<6"]
export = ["onnx>=1.17", "onnxscript>=0.3", "onnxruntime>=1.20"]

[project.scripts]
paperlab = "paperlab.cli:main"

[tool.setuptools.packages.find]
include = ["paperlab*"]

[tool.setuptools.package-data]
paperlab = ["debugger_web/*.html", "debugger_web/*.css", "debugger_web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
