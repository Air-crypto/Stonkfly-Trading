name: Paper lab checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # The full seeded suite takes ~14 minutes on hosted runners, before setup.
    timeout-minutes: 25
    env:
      # Sealed news features require this value before Python starts.
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,cloud,plots]'
      - run: python -m pytest -q
      - run: PYTHONPATH=vendor/stonkfly python -m pytest vendor/stonkfly/tests/test_neural.py -q
      - run: python -c 'import cloud; assert not cloud.ENABLED'
